<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>夜晚骑车的鹈鹕</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a14; display: flex;
               align-items: center; justify-content: center; overflow: hidden; }
  svg { width: 900px; max-width: 96vw; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <title>夜晚骑车的鹈鹕</title>

  <!-- 夜空渐变 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1e"/>
      <stop offset="0.6" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1d2746"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4e8c8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f4e8c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="420" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="60"  cy="60"  r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="120" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="50"  r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="90"  r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="40"  r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="130" r="1.5"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="60"  r="2.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="100" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50"  r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="130" r="1.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60"  r="2"><animate attributeName="opacity" values="1;0.4;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="180" r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="180" r="2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="170" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 月亮 -->
  <circle cx="770" cy="95" r="55" fill="url(#moonGlow)"/>
  <circle cx="770" cy="95" r="38" fill="#f4e8c8"/>
  <circle cx="755" cy="85" r="4" fill="#e0d0a8" opacity="0.5"/>
  <circle cx="782" cy="105" r="3" fill="#e0d0a8" opacity="0.5"/>
  <circle cx="775" cy="112" r="2" fill="#e0d0a8" opacity="0.4"/>

  <!-- 地面 -->
  <rect y="420" width="900" height="100" fill="#232733"/>
  <!-- 路面 -->
  <rect y="430" width="900" height="90" fill="#3a3f4d"/>
  <!-- 虚线车道线（向左移动，体现前进感） -->
  <path d="M0 475 H900" stroke="#e8e8e8" stroke-width="4" stroke-dasharray="40 30" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="350" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <!-- 自行车投影 -->
  <ellipse cx="560" cy="428" rx="130" ry="8" fill="#000000" opacity="0.35"/>

  <!-- ================= 自行车 ================= -->
  <g stroke="#d8d8e0" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- 后车架 -->
    <line x1="455" y1="292" x2="555" y2="360"/>
    <line x1="455" y1="292" x2="640" y2="296"/>
    <line x1="555" y1="360" x2="640" y2="296"/>
    <!-- 前叉 -->
    <line x1="640" y1="296" x2="650" y2="370" stroke-width="6"/>
    <!-- 车把 -->
    <path d="M640 296 L688 288" stroke-width="6"/>
    <path d="M688 288 L688 278" stroke-width="6"/>
  </g>
  <!-- 车座 -->
  <ellipse cx="455" cy="286" rx="26" ry="9" fill="#2b2b2b"/>
  <line x1="455" y1="286" x2="455" y2="272" stroke="#2b2b2b" stroke-width="6"/>

  <!-- 后轮 -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 470 375" to="360 470 375" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="470" cy="375" r="55" fill="#171a22" stroke="#171a22" stroke-width="8"/>
    <circle cx="470" cy="375" r="49" fill="none" stroke="#9aa0a8" stroke-width="3"/>
    <g stroke="#9aa0a8" stroke-width="2">
      <line x1="470" y1="375" x2="525" y2="375"/>
      <line x1="470" y1="375" x2="509" y2="414"/>
      <line x1="470" y1="375" x2="470" y2="430"/>
      <line x1="470" y1="375" x2="431" y2="414"/>
      <line x1="470" y1="375" x2="415" y2="375"/>
      <line x1="470" y1="375" x2="431" y2="336"/>
      <line x1="470" y1="375" x2="470" y2="320"/>
      <line x1="470" y1="375" x2="509" y2="336"/>
    </g>
    <circle cx="470" cy="375" r="7" fill="#cfd4da"/>
  </g>

  <!-- 前轮 -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 650 375" to="360 650 375" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="650" cy="375" r="55" fill="#171a22" stroke="#171a22" stroke-width="8"/>
    <circle cx="650" cy="375" r="49" fill="none" stroke="#9aa0a8" stroke-width="3"/>
    <g stroke="#9aa0a8" stroke-width="2">
      <line x1="650" y1="375" x2="705" y2="375"/>
      <line x1="650" y1="375" x2="689" y2="414"/>
      <line x1="650" y1="375" x2="650" y2="430"/>
      <line x1="650" y1="375" x2="611" y2="414"/>
      <line x1="650" y1="375" x2="595" y2="375"/>
      <line x1="650" y1="375" x2="611" y2="336"/>
      <line x1="650" y1="375" x2="650" y2="320"/>
      <line x1="650" y1="375" x2="689" y2="336"/>
    </g>
    <circle cx="650" cy="375" r="7" fill="#cfd4da"/>
  </g>

  <!-- 曲柄组（持续旋转） -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 560 365" to="360 560 365" dur="1.2s" repeatCount="indefinite"/>
    <line x1="560" y1="365" x2="593" y2="346" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="560" y1="365" x2="527" y2="384" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <circle cx="593" cy="346" r="5" fill="#333"/>
    <circle cx="527" cy="384" r="5" fill="#333"/>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g>
    <!-- 整体上下起伏 -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -5; 0 0" dur="1.2s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- 后腿（相位相反） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="25 462 272; -25 462 272; 25 462 272" dur="1.2s" repeatCount="indefinite"
                        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <line x1="462" y1="272" x2="538" y2="348" stroke="#f6f1e6" stroke-width="13"
            stroke-linecap="round"/>
      <ellipse cx="540" cy="352" rx="12" ry="7" fill="#f2a03d"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="430" cy="235" rx="68" ry="42" fill="#f6f1e6" stroke="#d8d0c0" stroke-width="2"/>

    <!-- 翅膀（小幅扇动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 400 235; -14 400 235; 0 400 235" dur="0.5s" repeatCount="indefinite"
                        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse cx="398" cy="228" rx="42" ry="23" fill="#e8e0d0" transform="rotate(-10 398 228)"/>
    </g>

    <!-- 尾巴 -->
    <path d="M368 246 L326 262 L368 270 Z" fill="#e8e0d0"/>

    <!-- 前腿 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-25 470 265; 25 470 265; -25 470 265" dur="1.2s" repeatCount="indefinite"
                        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <line x1="470" y1="265" x2="563" y2="343" stroke="#f6f1e6" stroke-width="13"
            stroke-linecap="round"/>
      <ellipse cx="565" cy="347" rx="12" ry="7" fill="#f2a03d"/>
    </g>

    <!-- 脖子 -->
    <path d="M485 235 C515 165 525 140 555 118" fill="none" stroke="#f6f1e6"
          stroke-width="26" stroke-linecap="round"/>

    <!-- 头部 -->
    <circle cx="560" cy="112" r="22" fill="#f6f1e6" stroke="#d8d0c0" stroke-width="2"/>
    <!-- 眼睛 -->
    <circle cx="568" cy="104" r="3.5" fill="#1a1a1a"/>

    <!-- 长喙 -->
    <path d="M580 105 L668 90 L586 126 Z" fill="#f2a03d" stroke="#d87f2a" stroke-width="1"/>
    <!-- 喉囊 -->
    <path d="M586 124 Q622 144 662 94 Z" fill="#e89b3f"/>
    <!-- 喙中缝 -->
    <line x1="584" y1="112" x2="660" y2="95" stroke="#d87f2a" stroke-width="1.5"/>
  </g>

  <!-- 标题 -->
  <text x="30" y="40" font-family="sans-serif" font-size="22" fill="#8fa0c8">
    夜晚骑车的鹈鹕
  </text>
</svg>
</body>
</html>
