<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜晚骑车的鹈鹕</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0a0f1e;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: min(92vw, 960px); height: auto; display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#203055"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9c8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f5e9c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 星星(闪烁) -->
  <g fill="#fff">
    <g>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
      <circle cx="60" cy="60" r="2"/><circle cx="120" cy="28" r="1.5"/>
      <circle cx="200" cy="75" r="2"/><circle cx="160" cy="140" r="1.5"/>
      <circle cx="40" cy="110" r="1.5"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
      <circle cx="300" cy="38" r="1.5"/><circle cx="420" cy="65" r="2.5"/>
      <circle cx="520" cy="28" r="1.5"/><circle cx="500" cy="140" r="2"/>
      <circle cx="350" cy="80" r="1.5"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="1.5s" repeatCount="indefinite"/>
      <circle cx="600" cy="95" r="2"/><circle cx="690" cy="30" r="1.5"/>
      <circle cx="770" cy="60" r="2"/><circle cx="660" cy="160" r="1.5"/>
      <circle cx="720" cy="175" r="1.5"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" begin="0.4s" repeatCount="indefinite"/>
      <circle cx="460" cy="100" r="1.5"/><circle cx="560" cy="150" r="1.5"/>
      <circle cx="740" cy="140" r="1.5"/><circle cx="260" cy="118" r="1.5"/>
      <circle cx="80" cy="180" r="2"/>
    </g>
  </g>

  <!-- 月亮 -->
  <circle cx="700" cy="95" r="60" fill="url(#moonGlow)">
    <animate attributeName="r" values="54;66;54" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="95" r="36" fill="#f5e9c8"/>
  <circle cx="688" cy="88" r="5" fill="#e8d9b8"/>
  <circle cx="712" cy="104" r="3.5" fill="#e8d9b8"/>
  <circle cx="700" cy="112" r="2.5" fill="#e8d9b8"/>

  <!-- 远山剪影 -->
  <path d="M 0 420 C 120 372 220 398 340 382 C 460 366 560 402 700 388 C 760 382 790 398 800 418 L 800 420 Z" fill="#1c2540"/>

  <!-- 地面 -->
  <rect x="0" y="418" width="800" height="82" fill="#2a3149"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#3b4560" stroke-width="3"/>

  <!-- 阴影 -->
  <ellipse cx="350" cy="419" rx="135" ry="9" fill="#171e30" opacity="0.55"/>

  <!-- 路面虚线(向后移动) -->
  <line x1="-60" y1="462" x2="860" y2="462" stroke="#414d6d" stroke-width="6" stroke-linecap="round" stroke-dasharray="50 50">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="-60" y1="486" x2="860" y2="486" stroke="#353f5c" stroke-width="4" stroke-linecap="round" stroke-dasharray="30 40">
    <animate attributeName="stroke-dashoffset" values="0;-70" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- 后轮(转动) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 250 350;360 250 350" dur="0.8s" repeatCount="indefinite"/>
    <circle cx="250" cy="350" r="58" fill="none" stroke="#262e42" stroke-width="9"/>
    <circle cx="250" cy="350" r="49" fill="none" stroke="#5c6b8c" stroke-width="3"/>
    <line x1="250" y1="302" x2="250" y2="398" stroke="#5c6b8c" stroke-width="3"/>
    <line x1="202" y1="350" x2="298" y2="350" stroke="#5c6b8c" stroke-width="3"/>
    <circle cx="250" cy="350" r="8" fill="#7d8baa"/>
  </g>

  <!-- 前轮(转动) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 450 350;360 450 350" dur="0.8s" repeatCount="indefinite"/>
    <circle cx="450" cy="350" r="58" fill="none" stroke="#262e42" stroke-width="9"/>
    <circle cx="450" cy="350" r="49" fill="none" stroke="#5c6b8c" stroke-width="3"/>
    <line x1="450" y1="302" x2="450" y2="398" stroke="#5c6b8c" stroke-width="3"/>
    <line x1="402" y1="350" x2="498" y2="350" stroke="#5c6b8c" stroke-width="3"/>
    <circle cx="450" cy="350" r="8" fill="#7d8baa"/>
  </g>

  <!-- 车架 -->
  <g stroke="#e0553a" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="287" y1="232" x2="252" y2="348"/>
    <line x1="287" y1="232" x2="428" y2="250"/>
    <line x1="254" y1="340" x2="422" y2="252"/>
    <line x1="428" y1="250" x2="450" y2="348"/>
    <path d="M 428 250 L 442 222 Q 458 208 430 206" stroke-width="7"/>
  </g>
  <!-- 鞍座 -->
  <ellipse cx="283" cy="224" rx="22" ry="6" fill="#3a3f52"/>

  <!-- 曲柄 + 脚踏(转动) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 350 315;360 350 315" dur="0.8s" repeatCount="indefinite"/>
    <line x1="320" y1="315" x2="380" y2="315" stroke="#5c6b8c" stroke-width="6" stroke-linecap="round"/>
    <rect x="343" y="282.5" width="14" height="5" rx="1.5" fill="#7d8baa"/>
    <rect x="343" y="342.5" width="14" height="5" rx="1.5" fill="#7d8baa"/>
    <circle cx="350" cy="315" r="7" fill="#5c6b8c"/>
  </g>

  <!-- 鹈鹕 -->
  <g>
    <!-- 尾巴 -->
    <path d="M 292 226 Q 252 220 246 198 L 296 218 Z" fill="#f7f4ec"/>
    <!-- 身体 -->
    <ellipse cx="335" cy="215" rx="48" ry="32" fill="#f7f4ec"/>
    <!-- 翅膀(轻微扇动) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 325 210;4 325 210;-4 325 210" dur="0.5s" repeatCount="indefinite"/>
      <path d="M 298 212 Q 324 188 354 206 Q 332 230 300 222 Z" fill="#e6e0d2" stroke="#d8d0c0" stroke-width="2"/>
    </g>
    <!-- 手臂(握车把) -->
    <path d="M 378 198 Q 406 186 432 206" fill="none" stroke="#f7f4ec" stroke-width="12" stroke-linecap="round"/>
    <!-- 脖子 -->
    <path d="M 368 206 Q 384 176 394 152" fill="none" stroke="#f7f4ec" stroke-width="24" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="402" cy="142" r="20" fill="#f7f4ec"/>
    <!-- 眼睛 -->
    <circle cx="409" cy="135" r="3.5" fill="#222"/>
    <!-- 喙 -->
    <path d="M 419 137 L 486 127 L 423 157 Z" fill="#f0b93c"/>
    <!-- 喉囊 -->
    <path d="M 419 141 Q 448 178 424 159 Z" fill="#e29b2e"/>

    <!-- 双腿蹬踏(12 个关键帧，脚精确跟随脚踏) -->
    <g fill="none" stroke="#f7f4ec" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 325 242 L 338 264 L 350 285">
        <animate attributeName="d"
          values="M 325 242 L 338 264 L 350 285;
                  M 325 242 L 345 266 L 365 289;
                  M 325 242 L 351 271 L 376 300;
                  M 325 242 L 353 279 L 380 315;
                  M 325 242 L 351 286 L 376 330;
                  M 325 242 L 345 292 L 365 341;
                  M 325 242 L 338 294 L 350 345;
                  M 325 242 L 330 292 L 335 341;
                  M 325 242 L 325 286 L 324 330;
                  M 325 242 L 323 279 L 320 315;
                  M 325 242 L 325 271 L 324 300;
                  M 325 242 L 330 266 L 335 289;
                  M 325 242 L 338 264 L 350 285"
          dur="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 345 244 L 348 295 L 350 345">
        <animate attributeName="d"
          values="M 345 244 L 348 295 L 350 345;
                  M 345 244 L 340 293 L 335 341;
                  M 345 244 L 335 287 L 324 330;
                  M 345 244 L 333 280 L 320 315;
                  M 345 244 L 335 272 L 324 300;
                  M 345 244 L 340 267 L 335 289;
                  M 345 244 L 348 265 L 350 285;
                  M 345 244 L 355 267 L 365 289;
                  M 345 244 L 361 272 L 376 300;
                  M 345 244 L 363 280 L 380 315;
                  M 345 244 L 361 287 L 376 330;
                  M 345 244 L 355 293 L 365 341;
                  M 345 244 L 348 295 L 350 345"
          dur="0.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 脚(跟随脚踏，12 个关键帧) -->
    <ellipse cx="350" cy="285" rx="9" ry="5" fill="#f7f4ec">
      <animate attributeName="cx" values="350;365;376;380;376;365;350;335;324;320;324;335;350" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="285;289;300;315;330;341;345;341;330;315;300;289;285" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="350" cy="345" rx="9" ry="5" fill="#f7f4ec">
      <animate attributeName="cx" values="350;335;324;320;324;335;350;365;376;380;376;365;350" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="345;341;330;315;300;289;285;289;300;315;330;341;345" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
</body>
</html>
