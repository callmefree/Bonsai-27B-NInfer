<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜晚骑车的鹈鹕</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #070a16;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  svg {
    width: 100%;
    height: 100%;
    max-width: 1100px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>夜晚，一只鹈鹕骑着自行车，车轮转动，双腿蹬踏</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1e"/>
      <stop offset="0.55" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#162040"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e6a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f5e6a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="490" cy="258" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="900" height="500" fill="url(#sky)"/>

  <!-- 星星（闪烁） -->
  <g fill="#eef3ff">
    <g>
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
      <circle cx="70" cy="55" r="2"/>
      <circle cx="180" cy="115" r="1.5"/>
      <circle cx="300" cy="45" r="2"/>
      <circle cx="520" cy="70" r="1.5"/>
      <circle cx="640" cy="140" r="2"/>
      <circle cx="830" cy="165" r="1.5"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      <circle cx="120" cy="150" r="1.5"/>
      <circle cx="260" cy="130" r="2"/>
      <circle cx="430" cy="40" r="1.5"/>
      <circle cx="700" cy="40" r="2"/>
      <circle cx="860" cy="60" r="1.5"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/>
      <circle cx="40" cy="200" r="1.5"/>
      <circle cx="350" cy="150" r="1.5"/>
      <circle cx="560" cy="130" r="2"/>
      <circle cx="760" cy="200" r="1.5"/>
      <circle cx="880" cy="230" r="1.5"/>
    </g>
  </g>

  <!-- 流星 -->
  <g>
    <line x1="560" y1="30" x2="640" y2="70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0"/>
    <circle cx="640" cy="70" r="2.5" fill="#ffffff" opacity="0"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;340 430" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- 月亮 -->
  <circle cx="770" cy="95" r="95" fill="url(#moonGlow)"/>
  <circle cx="770" cy="95" r="40" fill="#f5e6a8"/>
  <circle cx="758" cy="86" r="5" fill="#e3d09a"/>
  <circle cx="786" cy="108" r="3.5" fill="#e3d09a"/>
  <circle cx="772" cy="118" r="2.5" fill="#e3d09a"/>

  <!-- 城市剪影 -->
  <g fill="#131a30">
    <rect x="10" y="330" width="42" height="50"/>
    <rect x="62" y="300" width="32" height="80"/>
    <rect x="102" y="322" width="48" height="58"/>
    <rect x="160" y="292" width="34" height="88"/>
    <rect x="205" y="328" width="44" height="52"/>
    <rect x="500" y="312" width="30" height="68"/>
    <rect x="540" y="332" width="40" height="48"/>
    <rect x="595" y="298" width="34" height="82"/>
    <rect x="645" y="324" width="44" height="56"/>
    <rect x="720" y="308" width="28" height="72"/>
    <rect x="760" y="330" width="40" height="50"/>
    <rect x="820" y="318" width="42" height="62"/>
    <rect x="872" y="336" width="28" height="44"/>
  </g>
  <!-- 窗户灯光 -->
  <g fill="#ffd966">
    <rect x="72" y="310" width="6" height="6">
      <animate attributeName="opacity" values="1;0.1;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="82" y="330" width="6" height="6" opacity="0.8"/>
    <rect x="170" y="305" width="6" height="6">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="180" y="340" width="6" height="6" opacity="0.7"/>
    <rect x="605" y="312" width="6" height="6">
      <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="730" y="322" width="6" height="6" opacity="0.8"/>
    <rect x="835" y="332" width="6" height="6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" begin="2s"/>
    </rect>
  </g>

  <!-- 路面 -->
  <rect x="0" y="380" height="120" fill="#232838"/>
  <line x1="0" y1="380" x2="900" y2="380" stroke="#2e3550" stroke-width="3"/>
  <!-- 移动的车道虚线 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-70 0" dur="1s" repeatCount="indefinite"/>
    <line x1="-70" y1="415" x2="970" y2="415" stroke="#4a5274" stroke-width="4" stroke-dasharray="30 40"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#9aa4c8" stroke-linecap="round">
    <line x1="150" y1="180" x2="250" y2="180" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-320 0" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="235" x2="240" y2="235" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-320 0" dur="1.1s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="1.1s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="160" y1="290" x2="260" y2="290" stroke-width="2.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-320 0" dur="1.6s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="1.6s" repeatCount="indefinite" begin="0.6s"/>
    </line>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="385" cy="382" rx="160" ry="9" fill="#000000" opacity="0.28"/>

  <!-- 骑手整体（上下起伏） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="2s" repeatCount="indefinite"/>

    <!-- 车灯与光锥 -->
    <path d="M490,252 L700,318 L640,378 L490,282 Z" fill="url(#lamp)" opacity="0.3"/>
    <circle cx="488" cy="258" r="5" fill="#fff7c2"/>

    <!-- 后轮 -->
    <g>
      <circle cx="300" cy="338" r="42" fill="#1c2034" stroke="#2b3048" stroke-width="7"/>
      <circle cx="300" cy="338" r="33" fill="none" stroke="#3a4058" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 300 338" to="360 300 338" dur="2s" repeatCount="indefinite"/>
        <!-- 8 辐条，4 条直径，45° 均分 -->
        <line x1="300" y1="305" x2="300" y2="371" stroke="#8a90b0" stroke-width="2.5"/>
        <line x1="267" y1="338" x2="333" y2="338" stroke="#8a90b0" stroke-width="2.5"/>
        <line x1="276.7" y1="361.3" x2="323.3" y2="314.7" stroke="#8a90b0" stroke-width="2.5"/>
        <line x1="323.3" y1="361.3" x2="276.7" y2="314.7" stroke="#8a90b0" stroke-width="2.5"/>
        <circle cx="300" cy="338" r="6" fill="#cfd3e2"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="470" cy="338" r="42" fill="#1c2034" stroke="#2b3048" stroke-width="7"/>
      <circle cx="470" cy="338" r="33" fill="none" stroke="#3a4058" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 470 338" to="360 470 338" dur="2s" repeatCount="indefinite"/>
        <!-- 8 辐条，4 条直径，45° 均分 -->
        <line x1="470" y1="305" x2="470" y2="371" stroke="#8a90b0" stroke-width="2.5"/>
        <line x1="437" y1="338" x2="503" y2="338" stroke="#8a90b0" stroke-width="2.5"/>
        <line x1="446.7" y1="361.3" x2="493.3" y2="314.7" stroke="#8a90b0" stroke-width="2.5"/>
        <line x1="493.3" y1="361.3" x2="446.7" y2="314.7" stroke="#8a90b0" stroke-width="2.5"/>
        <circle cx="470" cy="338" r="6" fill="#cfd3e2"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#8a92b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M300,338 L385,338 L355,265 L455,280 L470,338"/>
      <path d="M385,338 L455,280"/>
      <path d="M455,280 L468,256 M456,254 L486,254"/>
    </g>
    <ellipse cx="355" cy="262" rx="17" ry="5.5" fill="#3a3f5c" transform="rotate(-6 355 262)"/>

    <!-- 曲柄（与车轮同步旋转） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 385 338" to="360 385 338" dur="2s" repeatCount="indefinite"/>
      <line x1="385" y1="338" x2="411" y2="338" stroke="#9aa3c0" stroke-width="5" stroke-linecap="round"/>
      <line x1="411" y1="332" x2="411" y2="344" stroke="#e8e2c8" stroke-width="5" stroke-linecap="round"/>
      <circle cx="385" cy="338" r="6" fill="#cfd3e2"/>
    </g>

    <!-- 鹈鹕 -->
    <g>
      <!-- 尾巴 -->
      <path d="M328,250 L292,240 L330,266 Z" fill="#d8dce8"/>
      <path d="M330,256 L300,258 L336,270 Z" fill="#e9ebf4"/>
      <!-- 身体 -->
      <ellipse cx="372" cy="238" rx="46" ry="32" fill="#f4f6fa"/>
      <ellipse cx="370" cy="250" rx="30" ry="18" fill="#e8eaf3"/>
      <!-- 翅膀（扇动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-12 362 248;12 362 248;-12 362 248" dur="1.5s" repeatCount="indefinite"/>
        <path d="M358,224 Q316,216 300,236 Q318,262 362,256 Z" fill="#e9ebf4" stroke="#d8dce8" stroke-width="1.5"/>
      </g>
      <!-- 前肢（扶车把） -->
      <path d="M405,235 Q442,244 468,256" stroke="#f4f6fa" stroke-width="15" stroke-linecap="round" fill="none"/>
      <!-- 脖子 -->
      <path d="M412,232 Q430,205 440,182" stroke="#f4f6fa" stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- 头 -->
      <circle cx="442" cy="172" r="20" fill="#f4f6fa"/>
      <!-- 嘴（带喉囊） -->
      <path d="M456,158 L516,172 L456,186 Z" fill="#f5a623"/>
      <path d="M458,180 L510,174 Q500,196 462,186 Z" fill="#e8941a"/>
      <!-- 眼睛 -->
      <circle cx="447" cy="166" r="3.2" fill="#2a2e45"/>
      <circle cx="448.5" cy="164.5" r="1" fill="#ffffff"/>

      <!-- 远腿（先画，颜色稍暗；与近腿反相位） -->
      <line x1="392" y1="270" stroke="#d8dbe6" stroke-width="11" stroke-linecap="round">
        <animate attributeName="x2" values="359;385;411;385;359" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="338;312;338;364;338" dur="2s" repeatCount="indefinite"/>
      </line>
      <!-- 远脚（保持水平，跟随远踏板） -->
      <ellipse rx="11" ry="7" fill="#d8dbe6">
        <animate attributeName="cx" values="359;385;411;385;359" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="338;312;338;364;338" dur="2s" repeatCount="indefinite"/>
      </ellipse>

      <!-- 近腿 -->
      <line x1="392" y1="270" stroke="#f4f6fa" stroke-width="11" stroke-linecap="round">
        <animate attributeName="x2" values="411;385;359;385;411" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="338;364;338;312;338" dur="2s" repeatCount="indefinite"/>
      </line>
      <!-- 近脚（保持水平，跟随踏板） -->
      <ellipse rx="11" ry="7" fill="#f4f6fa">
        <animate attributeName="cx" values="411;385;359;385;411" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="338;364;338;312;338" dur="2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
</body>
</html>
