<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜骑的鹈鹕</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e1f;overflow:hidden}
  svg{width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="0.6" stop-color="#121a38"/>
      <stop offset="1" stop-color="#1c2548"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e8b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f7e8b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#fff">
    <circle cx="50" cy="40" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="80" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="35" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="70" r="1.2"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="45" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="90" r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="35" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="75" r="1.2"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.0s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="40" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="150" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="45" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="110" r="1.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="150" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="140" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="150" r="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="140" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="170" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="170" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="200" r="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="190" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="190" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="190" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="210" r="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="230" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 月亮 -->
  <circle cx="700" cy="95" r="95" fill="url(#moonGlow)"/>
  <circle cx="700" cy="95" r="38" fill="#f7e8b8"/>
  <circle cx="686" cy="86" r="5" fill="#e3d2a2" opacity="0.6"/>
  <circle cx="712" cy="104" r="3.5" fill="#e3d2a2" opacity="0.5"/>
  <circle cx="700" cy="110" r="2.5" fill="#e3d2a2" opacity="0.45"/>

  <!-- 路灯 -->
  <g>
    <line x1="95" y1="415" x2="95" y2="205" stroke="#2a3a5c" stroke-width="6"/>
    <path d="M 95 205 L 128 205" stroke="#2a3a5c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="130" cy="212" r="26" fill="#ffd98a" opacity="0.18">
      <animate attributeName="opacity" values="0.14;0.26;0.14;0.22;0.14" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="212" r="7" fill="#ffd98a"/>
  </g>

  <!-- 滚动山丘与树 -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="1.1s" repeatCount="indefinite"/>
    <path d="M -300 415 Q 0 368 300 415 Q 600 368 900 415 Q 1200 368 1500 415 Z" fill="#16213f"/>
    <g fill="#1d2c4d">
      <path d="M 150 415 L 128 368 L 172 415 Z"/>
      <path d="M 450 415 L 428 368 L 472 415 Z"/>
      <path d="M 750 415 L 728 368 L 772 415 Z"/>
      <path d="M 1050 415 L 1028 368 L 1072 415 Z"/>
      <path d="M 1350 415 L 1328 368 L 1372 415 Z"/>
    </g>
  </g>

  <!-- 路面 -->
  <rect x="0" y="415" width="800" height="85" fill="#241d16"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="1.1s" repeatCount="indefinite"/>
    <line x1="-300" y1="462" x2="1500" y2="462" stroke="#4a3f33" stroke-width="4" stroke-dasharray="24 76" stroke-linecap="round"/>
  </g>
  <ellipse cx="560" cy="414" rx="90" ry="6" fill="#fff3c4" opacity="0.08"/>
  <ellipse cx="130" cy="414" rx="45" ry="8" fill="#ffd98a" opacity="0.1"/>

  <!-- 阴影 -->
  <ellipse cx="430" cy="417" rx="150" ry="9" fill="#000" opacity="0.35"/>

  <!-- 骑手（自行车 + 鹈鹕） -->
  <g id="rider">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.55s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- 后轮 -->
    <g transform="translate(330,367)">
      <circle r="48" fill="none" stroke="#17171a" stroke-width="9"/>
      <circle r="40" fill="none" stroke="#e8e2d4" stroke-width="2.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <g stroke="#c9c2b4" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="0" x2="40" y2="0"/><line x1="0" y1="0" x2="28" y2="28"/>
          <line x1="0" y1="0" x2="0" y2="40"/><line x1="0" y1="0" x2="-28" y2="28"/>
          <line x1="0" y1="0" x2="-40" y2="0"/><line x1="0" y1="0" x2="-28" y2="-28"/>
          <line x1="0" y1="0" x2="0" y2="-40"/><line x1="0" y1="0" x2="28" y2="-28"/>
        </g>
      </g>
      <circle r="7" fill="#2e2e2e"/><circle r="3" fill="#555"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(530,367)">
      <circle r="48" fill="none" stroke="#17171a" stroke-width="9"/>
      <circle r="40" fill="none" stroke="#e8e2d4" stroke-width="2.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <g stroke="#c9c2b4" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="0" x2="40" y2="0"/><line x1="0" y1="0" x2="28" y2="28"/>
          <line x1="0" y1="0" x2="0" y2="40"/><line x1="0" y1="0" x2="-28" y2="28"/>
          <line x1="0" y1="0" x2="-40" y2="0"/><line x1="0" y1="0" x2="-28" y2="-28"/>
          <line x1="0" y1="0" x2="0" y2="-40"/><line x1="0" y1="0" x2="28" y2="-28"/>
        </g>
      </g>
      <circle r="7" fill="#2e2e2e"/><circle r="3" fill="#555"/>
    </g>

    <!-- 车架 -->
    <g stroke="#ff6b35" stroke-width="7" fill="none" stroke-linecap="round">
      <line x1="330" y1="367" x2="435" y2="367"/>
      <line x1="435" y1="367" x2="365" y2="295"/>
      <line x1="365" y1="295" x2="505" y2="300"/>
      <line x1="365" y1="295" x2="435" y2="367"/>
      <line x1="505" y1="300" x2="520" y2="350"/>
      <line x1="520" y1="350" x2="526" y2="367"/>
      <line x1="520" y1="350" x2="534" y2="367"/>
    </g>
    <line x1="365" y1="295" x2="360" y2="250" stroke="#2e2e2e" stroke-width="6"/>
    <ellipse cx="360" cy="245" rx="22" ry="7" fill="#2e2e2e" transform="rotate(-5 360 245)"/>
    <line x1="505" y1="300" x2="512" y2="278" stroke="#2e2e2e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 512 278 C 524 266 544 264 552 272" stroke="#2e2e2e" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- 链条 + 齿盘 -->
    <path d="M 452 353 L 344 353" stroke="#3a3a3a" stroke-width="2.5" stroke-dasharray="4 4"/>
    <path d="M 452 381 L 344 381" stroke="#3a3a3a" stroke-width="2.5" stroke-dasharray="4 4"/>
    <circle cx="330" cy="367" r="9" fill="none" stroke="#3a3a3a" stroke-width="3"/>
    <g transform="translate(435,367)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      <circle r="18" fill="none" stroke="#3a3a3a" stroke-width="4"/>
      <line x1="0" y1="0" x2="18" y2="0" stroke="#3a3a3a" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#3a3a3a" stroke-width="2"/>
      <line x1="0" y1="0" x2="-18" y2="0" stroke="#3a3a3a" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#3a3a3a" stroke-width="2"/>
      <circle r="4" fill="#555"/>
    </g>

    <!-- 曲柄 + 脚踏 -->
    <g transform="translate(435,367)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="26" stroke="#2e2e2e" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#2e2e2e" stroke-width="5" stroke-linecap="round"/>
      <line x1="-8" y1="26" x2="8" y2="26" stroke="#2e2e2e" stroke-width="5" stroke-linecap="round"/>
      <line x1="-8" y1="-26" x2="8" y2="-26" stroke="#2e2e2e" stroke-width="5" stroke-linecap="round"/>
      <circle r="6" fill="#3a3a3a"/>
    </g>

    <!-- 双腿蹬踏 -->
    <line x1="388" y1="262" x2="435" y2="393" stroke="#f5b85e" stroke-width="11" stroke-linecap="round">
      <animate attributeName="x2" values="435;422;412.5;409;412.5;422;435;448;457.5;461;457.5;448;435" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="393;389.5;380;367;354;344.5;341;344.5;354;367;380;389.5;393" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="388" y1="262" x2="435" y2="341" stroke="#f5b85e" stroke-width="11" stroke-linecap="round">
      <animate attributeName="x2" values="435;448;457.5;461;457.5;448;435;422;412.5;409;412.5;422;435" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="341;344.5;354;367;380;389.5;393;389.5;380;367;354;344.5;341" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <ellipse cx="435" cy="393" rx="9" ry="4.5" fill="#f7d9a8" stroke="#e0b46a" stroke-width="1.5">
      <animate attributeName="cx" values="435;422;412.5;409;412.5;422;435;448;457.5;461;457.5;448;435" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="393;389.5;380;367;354;344.5;341;344.5;354;367;380;389.5;393" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="435" cy="341" rx="9" ry="4.5" fill="#f7d9a8" stroke="#e0b46a" stroke-width="1.5">
      <animate attributeName="cx" values="435;448;457.5;461;457.5;448;435;422;412.5;409;412.5;422;435" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="341;344.5;354;367;380;389.5;393;389.5;380;367;354;344.5;341" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 鹈鹕身体 -->
    <ellipse cx="395" cy="228" rx="55" ry="33" fill="#f7f3ea" stroke="#d9cfc0" stroke-width="2.5"/>

    <!-- 翅膀（扇动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-12 352 222; 14 352 222; -12 352 222" dur="0.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse cx="352" cy="222" rx="44" ry="15" fill="#e3dbcc" stroke="#c4bbae" stroke-width="2" transform="rotate(-10 352 222)"/>
      <path d="M 330 222 Q 345 230 362 226" stroke="#c4bbae" stroke-width="1.5" fill="none" transform="rotate(-10 352 222)"/>
    </g>

    <!-- 手臂 -->
    <path d="M 442 224 Q 488 238 528 270" stroke="#f7f3ea" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 448 230 Q 492 244 536 274" stroke="#f7f3ea" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- 脖子 -->
    <path d="M 430 214 C 452 198 468 180 478 164 C 484 154 490 150 496 148" stroke="#f7f3ea" stroke-width="21" fill="none" stroke-linecap="round"/>

    <!-- 头盔 -->
    <ellipse cx="502" cy="131" rx="17" ry="6.5" fill="#ff6b35"/>

    <!-- 头 -->
    <circle cx="502" cy="147" r="21" fill="#f7f3ea" stroke="#d9cfc0" stroke-width="2.5"/>

    <!-- 长喙 + 喉囊 -->
    <polygon points="518,139 606,158 520,152" fill="#ffb35c"/>
    <path d="M 520 152 Q 578 188 606 158 Z" fill="#ff8a2b"/>

    <!-- 眼睛 -->
    <circle cx="504" cy="142" r="4.2" fill="#1a1a1a"/>
    <circle cx="505.5" cy="140.8" r="1.3" fill="#fff"/>
  </g>

  <!-- 车灯 + 光锥 -->
  <polygon points="514,262 700,320 700,372 514,286" fill="url(#cone)"/>
  <circle cx="516" cy="274" r="12" fill="#fff7d6" opacity="0.35">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="516" cy="274" r="5" fill="#fff7d6"/>
</svg>
</body>
</html>
