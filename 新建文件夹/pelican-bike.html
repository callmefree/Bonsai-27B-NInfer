<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>夜晚骑行 · 鹈鹕</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1e; }
  svg { width: 100vw; height: 100vh; display: block; }
  .spin  { transform-box: fill-box;   transform-origin: center;    animation: spin 1.4s linear infinite; }
  .leg-a { transform-box: view-box;   transform-origin: 398px 282px; animation: pedalA 1.0s ease-in-out infinite; }
  .leg-b { transform-box: view-box;   transform-origin: 398px 282px; animation: pedalB 1.0s ease-in-out infinite; }
  .dash  { animation: dash 0.55s linear infinite; }
  .star  { animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes pedalA { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }
  @keyframes pedalB { 0%,100% { transform: rotate(15deg);  } 50% { transform: rotate(-15deg); } }
  @keyframes dash   { to { stroke-dashoffset: -40; } }
  @keyframes twinkle{ 0%,100% { opacity: .18; } 50% { opacity: 1; } }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0a1026"/>
      <stop offset=".7"  stop-color="#12203f"/>
      <stop offset="1"   stop-color="#1b2a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="800" height="410" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#fff">
    <circle class="star" cx="60"  cy="40"  r="2"   style="animation-delay:0s"/>
    <circle class="star" cx="130" cy="92"  r="1.5" style="animation-delay:.4s; animation-duration:3s"/>
    <circle class="star" cx="210" cy="55"  r="2.5" style="animation-delay:.8s"/>
    <circle class="star" cx="300" cy="120" r="1.5" style="animation-delay:1.2s; animation-duration:2.2s"/>
    <circle class="star" cx="390" cy="60"  r="2"   style="animation-delay:1.6s"/>
    <circle class="star" cx="470" cy="105" r="1.5" style="animation-delay:.5s; animation-duration:3.2s"/>
    <circle class="star" cx="545" cy="48"  r="2"   style="animation-delay:.9s"/>
    <circle class="star" cx="620" cy="115" r="1.5" style="animation-delay:1.3s; animation-duration:2.4s"/>
    <circle class="star" cx="740" cy="32"  r="2"   style="animation-delay:1.7s"/>
    <circle class="star" cx="772" cy="132" r="1.5" style="animation-delay:.6s"/>
    <circle class="star" cx="160" cy="165" r="1.5" style="animation-delay:1.9s; animation-duration:3s"/>
    <circle class="star" cx="260" cy="185" r="2"   style="animation-delay:1.1s"/>
    <circle class="star" cx="500" cy="175" r="1.5" style="animation-delay:2.1s"/>
    <circle class="star" cx="660" cy="175" r="2"   style="animation-delay:.3s; animation-duration:2.8s"/>
  </g>

  <!-- 月亮 -->
  <circle cx="690" cy="70" r="28" fill="#f7f3d7"/>
  <circle cx="682" cy="62" r="4"  fill="#e3ddc4"/>
  <circle cx="698" cy="78" r="3"  fill="#e3ddc4"/>

  <!-- 远山剪影 -->
  <path d="M0 410 L120 350 L240 410 L380 362 L520 410 L660 346 L800 410 Z" fill="#101a30"/>

  <!-- 地面与道路虚线（模拟前进） -->
  <rect y="410" width="800" height="90" fill="#232938"/>
  <line class="dash" x1="-60" y1="446" x2="860" y2="446" stroke="#4a5266" stroke-width="2" stroke-dasharray="20 20"/>

  <!-- 车轮阴影 -->
  <ellipse cx="410" cy="412" rx="150" ry="9" fill="rgba(0,0,0,.35)"/>

  <!-- ===== 后轮 ===== -->
  <g>
    <circle cx="300" cy="350" r="60" fill="#10131c" stroke="#2b3040" stroke-width="4"/>
    <circle cx="300" cy="350" r="50" fill="none" stroke="#5a6178" stroke-width="2"/>
    <g class="spin">
      <line x1="300" y1="300" x2="300" y2="400" stroke="#7a8095" stroke-width="2"/>
      <line x1="250" y1="350" x2="350" y2="350" stroke="#7a8095" stroke-width="2"/>
      <line x1="265" y1="315" x2="335" y2="385" stroke="#7a8095" stroke-width="2"/>
      <line x1="335" y1="315" x2="265" y2="385" stroke="#7a8095" stroke-width="2"/>
    </g>
    <circle cx="300" cy="350" r="6" fill="#9aa0b5"/>
  </g>

  <!-- ===== 前轮 ===== -->
  <g>
    <circle cx="520" cy="350" r="60" fill="#10131c" stroke="#2b3040" stroke-width="4"/>
    <circle cx="520" cy="350" r="50" fill="none" stroke="#5a6178" stroke-width="2"/>
    <g class="spin">
      <line x1="520" y1="300" x2="520" y2="400" stroke="#7a8095" stroke-width="2"/>
      <line x1="470" y1="350" x2="570" y2="350" stroke="#7a8095" stroke-width="2"/>
      <line x1="485" y1="315" x2="555" y2="385" stroke="#7a8095" stroke-width="2"/>
      <line x1="555" y1="315" x2="485" y2="385" stroke="#7a8095" stroke-width="2"/>
    </g>
    <circle cx="520" cy="350" r="6" fill="#9aa0b5"/>
  </g>

  <!-- ===== 车架 ===== -->
  <g stroke="#c8442e" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="300" y1="350" x2="358" y2="238"/>
    <line x1="358" y1="238" x2="486" y2="250"/>
    <line x1="300" y1="350" x2="486" y2="250"/>
    <line x1="486" y1="250" x2="508" y2="300"/>
    <line x1="508" y1="300" x2="520" y2="348"/>
  </g>
  <g stroke="#c8442e" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M508 300 C 520 284, 545 280, 562 286"/>
    <line x1="545" y1="276" x2="568" y2="276"/>
  </g>
  <ellipse cx="362" cy="232" rx="16" ry="6" fill="#222"/>
  <!-- 链条轮与脚踏 -->
  <circle cx="300" cy="350" r="14" fill="none" stroke="#9aa0b5" stroke-width="2"/>
  <circle cx="520" cy="350" r="7"  fill="none" stroke="#9aa0b5" stroke-width="2"/>
  <g stroke="#9aa0b5" stroke-width="4" stroke-linecap="round">
    <line x1="300" y1="350" x2="332" y2="382"/>
    <line x1="300" y1="350" x2="268" y2="318"/>
  </g>
  <rect x="327" y="380" width="16" height="4" fill="#9aa0b5"/>
  <rect x="264" y="316" width="16" height="4" fill="#9aa0b5"/>
  <!-- 车灯 -->
  <circle cx="572" cy="286" r="26" fill="url(#glow)"/>
  <circle cx="572" cy="286" r="5"  fill="#fff7c0"/>

  <!-- ===== 鹈鹕 ===== -->
  <g>
    <!-- 双腿（蹬踏） -->
    <g class="leg-b">
      <line x1="398" y1="282" x2="272" y2="320" stroke="#f5f0e6" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="270" cy="322" rx="11" ry="6" fill="#f5f0e6" transform="rotate(-15 270 322)"/>
    </g>
    <g class="leg-a">
      <line x1="398" y1="282" x2="332" y2="380" stroke="#f5f0e6" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="332" cy="382" rx="11" ry="6" fill="#f5f0e6" transform="rotate(10 332 382)"/>
    </g>
    <!-- 尾巴 -->
    <path d="M338 262 L298 282 L340 294 Z" fill="#f5f0e6"/>
    <!-- 身体 -->
    <ellipse cx="385" cy="262" rx="52" ry="34" fill="#f7f2e8"/>
    <!-- 翅膀 -->
    <path d="M352 240 C 318 252, 312 278, 330 292 C 352 288, 362 272, 358 256 Z" fill="#d8d0bd"/>
    <!-- 脖子 -->
    <path d="M428 258 C 438 240, 446 236, 452 232" stroke="#f7f2e8" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="458" cy="232" r="20" fill="#f7f2e8"/>
    <!-- 眼睛 -->
    <circle cx="464" cy="227" r="3.5" fill="#1c1c1c"/>
    <!-- 大喙 + 喉囊 -->
    <path d="M476 222 L566 246 Q 568 260 540 268 Q 505 272 484 256 Z" fill="#f7d78a" stroke="#e8b64f" stroke-width="1.5"/>
  </g>
</svg>
</body>
</html>
