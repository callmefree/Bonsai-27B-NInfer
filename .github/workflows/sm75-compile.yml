name: sm75 compile + package (Turing / Tesla T10)

# Builds the FULL NInfer server (ninfer-serve) and CLI (ninfer) for sm_75 (Turing,
# Tesla T10) with CUDA 13.1, verifies the generated SASS contains NO cp.async
# instructions (cp.async is Ampere+, so sm_75 must use the synchronous fallback in
# memory.cuh), and uploads the statically-linked server binary as a downloadable
# artifact so it can be deployed on the real Tesla T10 without recompiling there.
#
# NOTE: GitHub-hosted runners have no GPU. That is fine — nvcc cross-compiles to
# sm_75 and the server only links against CUDA runtime libs (present in the devel
# image). Only *runtime* inference validation still needs the real Tesla T10.

on:
  push:
    branches: [sm75-port]
  workflow_dispatch:

jobs:
  build-sm75:
    runs-on: ubuntu-24.04
    # CUDA 13.1 devel image ships nvcc + cuobjdump + libcudart; no GPU required.
    container:
      image: nvidia/cuda:13.1.0-devel-ubuntu24.04

    env:
      CC: gcc-13
      CXX: g++-13

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake ninja-build pkg-config \
            gcc-13 g++-13 \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libcurl4-openssl-dev \
            libssl-dev zlib1g-dev
          # Sanity: confirm toolchain versions
          nvcc --version | head -3
          cmake --version | head -1
          gcc-13 --version | head -1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (sm_75, apps ON)
        run: |
          # --keep-dir must exist BEFORE cmake runs: nvcc writes kept intermediates
          # even during the compiler-identification try-compile, and fails if the
          # directory is missing.
          mkdir -p "$GITHUB_WORKSPACE/ptx_keep"
          cmake -G Ninja -B build \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINFER_BUILD_APPS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CUDA_FLAGS="-lineinfo --keep --keep-dir=$GITHUB_WORKSPACE/ptx_keep"

      - name: Build ninfer_ops (sm_75)
        run: cmake --build build --target ninfer_ops -j 2

      - name: Build ninfer-serve + ninfer + perplexity (sm_75, full server)
        run: cmake --build build --target ninfer-serve ninfer ninfer-perplexity -j 2

      # Compiles the Turing MMA bridge probe. It cannot run here (no GPU on the runner), but
      # building it keeps the probe from rotting and proves the fp16 bridge compiles.
      - name: Build sm_75 MMA bridge self-test
        run: cmake --build build --target ninfer-sm75-mma-selftest -j 2

      - name: Diagnose remaining bf16 cvt emitters (kept PTX + .loc map)
        if: failure()
        run: |
          # NOTE: in PTX the instruction is cvt.rn.bf16x2.f32 (rounding modifier
          # present); only the ptxas *error message* abbreviates it to
          # cvt.bf16x2.f32. The pattern must tolerate the modifier.
          for f in $(find "$GITHUB_WORKSPACE/ptx_keep" -name '*.ptx' 2>/dev/null); do
            if grep -qE 'cvt\.[a-z0-9.]*bf16x2\.f32' "$f"; then
              echo "########## $f ##########"
              echo "--- .file map ---"
              grep -n '^[[:space:]]*\.file' "$f" | head -30
              echo "--- cvt sites with nearest source .loc ---"
              awk '/^[[:space:]]*\.loc/ { loc=$0 }
                   /cvt\.[a-z0-9.]*bf16x2\.f32/ { n++; print "cvt #" n ": " $0; print "   " loc }
                   n>=12 { exit }' "$f"
            fi
          done

      - name: "Verify sm_75 SASS: no Ampere+/Hopper/Blackwell-only instructions"
        run: |
          set -e
          OBJDIR=build/src/CMakeFiles/ninfer_ops.dir
          # Instructions that cannot exist on Turing (sm_75). Any hit means an
          # architecture guard is missing and sm_89/sm_120 code leaked into the
          # sm_75 build — "it compiled" is NOT evidence it will run correctly.
          #   LDGSTS / CPASYNC      : cp.async            (Ampere+ )
          #   .E4M3 / .E5M2         : FP8 MMA             (Ada sm_89+)
          #   CPASYNC.BULK / UBLKCP : TMA bulk async copy (Hopper+ )
          #   WGMMA / UTCHMMA / OMMA: warpgroup MMA       (Hopper+/Blackwell)
          #   SETMAXNREG            : register realloc    (Hopper+ )
          PAT='LDGSTS|CPASYNC|\.E4M3|\.E5M2|UBLKCP|WGMMA|UTCHMMA|OMMA|SETMAXNREG'
          found=0
          for o in $(find "$OBJDIR" -name '*.o'); do
            arch=$(cuobjdump "$o" 2>/dev/null | grep -oE 'arch = sm_[0-9a-z]+' | head -1 || true)
            cnt=$(cuobjdump -sass "$o" 2>/dev/null | grep -icE "$PAT" || true)
            echo "$o :: ${arch:-no-device-code} :: forbidden_hits=$cnt"
            if [ "${cnt:-0}" -gt 0 ]; then found=1; fi
          done
          if [ "$found" -ne 0 ]; then
            echo "FAIL: non-Turing instructions present in the sm_75 build."
            echo "      An __CUDA_ARCH__/macro guard is missing -> fix the guard, do not"
            echo "      ship this binary (compiles fine != runs correctly)."
            exit 1
          fi
          echo "PASS: ninfer_ops sm_75 SASS is Turing-clean (no cp.async/FP8/TMA/wgmma)"

      - name: "Static health report (arch / shared budget / macro exposure)"
        run: |
          set -e
          REPORT="$GITHUB_WORKSPACE/static-health-report.txt"
          BIN=build/apps/ninfer-serve
          OBJDIR=build/src/CMakeFiles/ninfer_ops.dir
          {
            echo "===== 1. embedded device architecture ====="
            cuobjdump -header "$BIN" 2>/dev/null | grep -oE 'sm_[0-9a-z]+' | sort | uniq -c \
              || echo "(arch extraction failed)"
            echo
            echo "===== 2. kernel inventory + shared-memory budget ====="
            echo "static shared wall for sm_75/sm_86/sm_89 = 48 KiB (49152 B)"
            cuobjdump -res-usage "$BIN" > /tmp/res.txt 2>/dev/null || true
            echo "res-usage lines: $(wc -l < /tmp/res.txt)"
            echo "--- format sample (first 12 lines) ---"
            head -12 /tmp/res.txt
            echo "--- kernel count (unique mangled names) ---"
            grep -oE '_Z[A-Za-z0-9_]+' /tmp/res.txt | sort -u | wc -l
            echo "--- over-48KiB kernels (SHARED > 49152) ---"
            grep -oE 'SHARED:[0-9]+' /tmp/res.txt | cut -d: -f2 \
              | awk '$1>49152{c++} END{print "count=" c+0}'
            echo "--- top 8 SHARED users ---"
            grep -oE 'SHARED:[0-9]+' /tmp/res.txt | sort -t: -k2 -nr | head -8
            echo "--- ternary kernels present? ---"
            grep -oiE '_Z[A-Za-z0-9_]*ternary[A-Za-z0-9_]*' /tmp/res.txt | sort -u | wc -l
            echo
            echo "===== 3. compile-time SM count (kTargetSmCount) ====="
            echo -n "objects with NINFER_SM89 (kernel-family switch, kept ON for sm_75): "
            grep -c 'NINFER_SM89' build/compile_commands.json 2>/dev/null || echo 0
            echo -n "objects with NINFER_SM75 (SM-count override): "
            grep -c 'NINFER_SM75' build/compile_commands.json 2>/dev/null || echo 0
            echo -n "declared value: "
            grep -oE 'NINFER_SM75_SM_COUNT=[0-9]+' build/compile_commands.json 2>/dev/null \
              | sort -u | tr '\n' ' ' ; echo
            echo "NOTE: NINFER_SM89 is a kernel-family switch (i8/rk4v4 kernels + the 48 KiB"
            echo "      capped w8 schedules) and must stay ON for sm_75 -- Turing shares that"
            echo "      wall. NINFER_SM75 overrides only kTargetSmCount so a split grid is one"
            echo "      resident wave: 56 (TU102-890), not 128 (RTX 4090/5080)."
          } 2>&1 | tee "$REPORT"
          echo "report written: $(wc -l < "$REPORT") lines"

      - name: "Verify sm_75 target SM count is 56 (not the 4090's 128)"
        run: |
          set -e
          CC=build/compile_commands.json
          if [ ! -f "$CC" ]; then echo "FAIL: $CC missing"; exit 1; fi
          hits=$(grep -c 'NINFER_SM75=1' "$CC" || true)
          echo "compile units with NINFER_SM75=1: $hits"
          if [ "${hits:-0}" -eq 0 ]; then
            echo "FAIL: sm_75 build has no NINFER_SM75=1 -> kTargetSmCount fell back to 128"
            exit 1
          fi
          val=$(grep -oE 'NINFER_SM75_SM_COUNT=[0-9]+' "$CC" | sort -u | head -1 | cut -d= -f2)
          echo "NINFER_SM75_SM_COUNT = ${val:-<unset>}"
          if [ "${val:-56}" != "56" ]; then
            echo "FAIL: expected 56 SM for Tesla T10, got $val"
            exit 1
          fi
          # The override must not have switched OFF the 4090 i8 kernel family.
          sm89=$(grep -c 'NINFER_SM89=1' "$CC" || true)
          echo "compile units keeping NINFER_SM89=1 (i8 kernel family): $sm89"
          if [ "${sm89:-0}" -eq 0 ]; then
            echo "FAIL: NINFER_SM89=1 lost -- the i8/rk4v4 kernel family got switched off"
            exit 1
          fi
          echo "PASS: kTargetSmCount=56 while the sm_89 kernel family stays enabled"

      - name: "Map __trap() sites in sm_75 SASS (runtime crash risk -- informational)"
        run: |
          set -e
          OBJDIR=build/src/CMakeFiles/ninfer_ops.dir
          MAP=trap-map.txt
          : > "$MAP"
          for o in $(find "$OBJDIR" -name '*.o'); do
            cuobjdump -sass "$o" 2>/dev/null | awk -v obj="$o" '
              /Function : / { fn = $3 }
              /TRAP|BREAK|BRKPT/ { if (fn != "") { print obj " :: " fn; fn = "" } }
            ' >> "$MAP" || true
          done
          n=$(grep -c '::' "$MAP" || true)
          echo "===== __trap() sites in sm_75 SASS ====="
          echo "kernels containing TRAP/BREAK: ${n}"
          echo
          for pat in "ternary.*s8|s8.*ternary" "state_passing|gated_delta" "fp8" "i8" "nvfp4"; do
            c=$(grep -icE "$pat" "$MAP" || true)
            echo "  [$pat] -> $c"
          done
          echo
          echo "--- first 40 ---"
          sed 's|src/CMakeFiles/ninfer_ops.dir/||' "$MAP" | head -40
          echo
          echo "WARNING: a trap on the ternary s8 rung or in GDN chunked state_passing"
          echo "         means prefill crashes at runtime. See PORT_sm75_TURING.md risk 1."
          {
            echo; echo "===== 4. __trap() sites in sm_75 SASS (runtime crash risk) ====="
            echo "kernels containing TRAP/BREAK: ${n}"
            echo "--- full list ---"
            sed 's|src/CMakeFiles/ninfer_ops.dir/||' "$MAP"
          } >> static-health-report.txt

      - name: Upload static health report
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-sm75-static-report
          path: static-health-report.txt
          if-no-files-found: warn

      - name: "Sanity: linkage check (no GPU needed)"
        run: |
          echo "--- binaries exist ---"
          ls -la build/apps/ninfer-serve build/apps/ninfer
          echo "--- dynamic deps ---"
          (ldd build/apps/ninfer-serve || true) | grep -iE 'cudart|cuda|not found' || true

      - name: Upload ninfer-serve + ninfer + perplexity binaries (sm_75)
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-sm75-server
          path: |
            build/apps/ninfer-serve
            build/apps/ninfer
            build/apps/ninfer-perplexity
          if-no-files-found: error

      # Run this on the T10 before the first real prefill: it is the only check that can prove
      # the tf32->fp16 and bf16->fp16 fragment bridges are packed correctly.
      - name: Upload sm_75 MMA bridge self-test
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-sm75-mma-selftest
          path: build/apps/ninfer-sm75-mma-selftest
          if-no-files-found: error
