name: sm75 compile + package (Turing / Tesla T10)

# Builds the FULL NInfer server (ninfer-serve) and CLI (ninfer) for sm_75 (Turing,
# Tesla T10) with CUDA 13.1, verifies the generated SASS contains NO cp.async
# instructions (cp.async is Ampere+, so sm_75 must use the synchronous fallback in
# memory.cuh), and uploads the statically-linked server binary as a downloadable
# artifact so it can be deployed on the real Tesla T10 without recompiling there.
#
# NOTE: GitHub-hosted runners have no GPU. That is fine — nvcc cross-compiles to
# sm_75 and the server only links against CUDA runtime libs (present in the devel
# image). Only *runtime* inference validation still needs the real Tesla T10.

on:
  push:
    branches: [sm75-port]
  workflow_dispatch:

jobs:
  build-sm75:
    runs-on: ubuntu-24.04
    # CUDA 13.1 devel image ships nvcc + cuobjdump + libcudart; no GPU required.
    container:
      image: nvidia/cuda:13.1.0-devel-ubuntu24.04

    env:
      CC: gcc-13
      CXX: g++-13

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake ninja-build pkg-config \
            gcc-13 g++-13 \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libcurl4-openssl-dev \
            libssl-dev zlib1g-dev
          # Sanity: confirm toolchain versions
          nvcc --version | head -3
          cmake --version | head -1
          gcc-13 --version | head -1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (sm_75, apps ON)
        run: |
          # --keep-dir must exist BEFORE cmake runs: nvcc writes kept intermediates
          # even during the compiler-identification try-compile, and fails if the
          # directory is missing.
          mkdir -p "$GITHUB_WORKSPACE/ptx_keep"
          cmake -G Ninja -B build \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINFER_BUILD_APPS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CUDA_FLAGS="-lineinfo --keep --keep-dir=$GITHUB_WORKSPACE/ptx_keep"

      - name: Build ninfer_ops (sm_75)
        run: cmake --build build --target ninfer_ops -j 2

      - name: Build ninfer-serve + ninfer (sm_75, full server)
        run: cmake --build build --target ninfer-serve ninfer -j 2

      - name: Diagnose remaining bf16 cvt emitters (kept PTX + .loc map)
        if: failure()
        run: |
          # NOTE: in PTX the instruction is cvt.rn.bf16x2.f32 (rounding modifier
          # present); only the ptxas *error message* abbreviates it to
          # cvt.bf16x2.f32. The pattern must tolerate the modifier.
          for f in $(find "$GITHUB_WORKSPACE/ptx_keep" -name '*.ptx' 2>/dev/null); do
            if grep -qE 'cvt\.[a-z0-9.]*bf16x2\.f32' "$f"; then
              echo "########## $f ##########"
              echo "--- .file map ---"
              grep -n '^[[:space:]]*\.file' "$f" | head -30
              echo "--- cvt sites with nearest source .loc ---"
              awk '/^[[:space:]]*\.loc/ { loc=$0 }
                   /cvt\.[a-z0-9.]*bf16x2\.f32/ { n++; print "cvt #" n ": " $0; print "   " loc }
                   n>=12 { exit }' "$f"
            fi
          done

      - name: Verify no cp.async in sm_75 SASS
        run: |
          set -e
          OBJDIR=build/src/CMakeFiles/ninfer_ops.dir
          found=0
          for o in $(find "$OBJDIR" -name '*.o'); do
            arch=$(cuobjdump "$o" 2>/dev/null | grep -oE 'arch = sm_[0-9a-z]+' | head -1 || true)
            cnt=$(cuobjdump -sass "$o" 2>/dev/null | grep -icE 'CPASYNC|cp\.async' || true)
            echo "$o :: ${arch:-no-device-code} :: cp.async_hits=$cnt"
            if [ "${cnt:-0}" -gt 0 ]; then found=1; fi
          done
          if [ "$found" -ne 0 ]; then
            echo "FAIL: cp.async SASS present in sm_75 build (Turing has no cp.async)"
            exit 1
          fi
          echo "PASS: ninfer_ops sm_75 SASS contains no cp.async"

      - name: "Sanity: linkage check (no GPU needed)"
        run: |
          echo "--- ninfer-serve ---"
          build/apps/ninfer-serve --version 2>&1 | head -3 || echo "(--version unsupported, continuing)"
          echo "--- ninfer ---"
          build/apps/ninfer --version 2>&1 | head -3 || true
          file build/apps/ninfer-serve build/apps/ninfer
          ldd build/apps/ninfer-serve | grep -iE 'cudart|cuda|not found' || true

      - name: Upload ninfer-serve + ninfer binaries (sm_75)
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-sm75-server
          path: |
            build/apps/ninfer-serve
            build/apps/ninfer
          if-no-files-found: error
